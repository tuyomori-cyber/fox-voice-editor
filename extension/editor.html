<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>fox-voice-editor</title>
  <link rel="stylesheet" href="editor.css">
  <script type="module" src="editor.mjs"></script>
</head>
<body>
  <main>
    <header>
      <h1>fox-voice-editor</h1>
    </header>

    <div class="workspace">
      <section class="workspace-panel editor-panel" aria-label="ブロック編集">
        <div class="editor-toolbar">
          <div class="engine-controls">
            <label for="recognition-engine">認識エンジン</label>
            <select id="recognition-engine" disabled>
              <option value="whisper">Whisper（base）</option>
              <option value="reazonspeech_k2">ReazonSpeech K2（INT8）</option>
            </select>
            <button id="internal-status-toggle" type="button" aria-expanded="false" aria-controls="internal-status">内部状態</button>
            <button id="retry-engine" type="button" hidden>モデル準備を再試行</button>
          </div>
          <div class="controls">
            <button id="record-toggle" type="button" disabled>録音開始</button>
            <button id="cancel" type="button" disabled>キャンセル</button>
            <button id="check-microphone" type="button" disabled>マイクを再確認</button>
          </div>
          <button id="toggle-reorder" type="button" aria-pressed="false">並べ替え</button>
          <button id="clear-document" type="button">文書を消去</button>
        </div>
        <div id="internal-status" class="internal-status" role="dialog" aria-label="内部状態" hidden>
          <p id="status" role="status" aria-live="polite">準備中…</p>
          <p id="microphone-status" role="status" aria-live="polite">マイク未確認</p>
          <p id="engine-status" role="status" aria-live="polite">認識エンジンを確認中…</p>
          <p id="timer"></p>
        </div>
        <p id="error" role="alert"></p>
        <div id="blocks" aria-label="編集する文章"></div>
        <div id="block-menu" class="context-menu" role="group" aria-label="ブロック操作" hidden>
          <button id="insert-before" type="button" hidden>前へ挿入</button>
          <button id="insert-after" type="button" hidden>後ろへ挿入</button>
          <button id="delete-block" type="button">削除</button>
          <button id="clear-block-selection" type="button" hidden>選択解除（すべて）</button>
        </div>
        <div class="manual-entry">
          <label for="manual-text">手入力</label>
          <input id="manual-text" type="text" inputmode="text" autocomplete="off" enterkeyhint="done" placeholder="文字を入力">
          <button id="add-manual-block" type="button" disabled>追加</button>
          <button id="add-template" type="button" disabled>定型へ追加</button>
        </div>
        <div class="section-heading preview-heading">
          <h2 id="preview-title">プレビュー</h2>
          <button id="copy" type="button" disabled>コピー</button>
          <button id="send-focodex" type="button" disabled>Focodexへ貼り付け</button>
        </div>
        <p id="preview" class="preview"></p>
        <p id="focodex-status" role="status" aria-live="polite"></p>
        <button id="check-focodex" type="button" disabled>同じ文章を再送</button>
        <details>
          <summary>拡張連携設定</summary>
          <label for="focodex-target">Focodexの送信先拡張ID</label>
          <input id="focodex-target" type="text" maxlength="256" value="focodex@foxbook.example">
          <label for="fx-osk-target">FX-OSKの拡張ID</label>
          <input id="fx-osk-target" type="text" maxlength="256" value="fx-osk-touch@tuyomori-cyber.github.io">
          <button id="save-extension-targets" type="button">連携先を保存</button>
        </details>
        <p id="save-status" role="status" aria-live="polite"></p>
      </section>

      <section class="workspace-panel history-panel" aria-label="履歴・定型・記号">
        <div class="side-tabs" role="tablist" aria-label="履歴・定型・記号">
          <button id="history-tab" type="button" role="tab" aria-selected="true" aria-controls="history-view">履歴</button>
          <button id="fixed-tab" type="button" role="tab" aria-selected="false" aria-controls="fixed-view">定型</button>
          <button id="symbol-tab" type="button" role="tab" aria-selected="false" aria-controls="symbol-view">記号</button>
        </div>
        <div id="history-view" role="tabpanel" aria-labelledby="history-tab">
          <p id="selected-history" role="status">語句をタップして選択。複数選択するとまとめてピン留め・削除できます。</p>
          <div id="history-items"></div>
          <div id="history-menu" class="context-menu" role="group" aria-label="選択した履歴の操作" hidden>
            <button id="history-pin" type="button">ピン留め</button>
            <button id="history-delete" type="button">履歴から削除</button>
            <button id="clear-history-selection" type="button" hidden>選択解除（すべて）</button>
          </div>
          <button id="load-more" type="button" hidden>さらに表示</button>
          <button id="clear-history" type="button">履歴をすべて消去</button>
        </div>
        <div id="fixed-view" role="tabpanel" aria-labelledby="fixed-tab" hidden>
          <p id="selected-template" role="status">定型をタップして選択。複数選択するとまとめて削除できます。</p>
          <div id="fixed-items"></div>
          <div id="template-menu" class="context-menu" role="group" aria-label="選択した定型の操作" hidden>
            <button id="template-delete" type="button">定型から削除</button>
            <button id="clear-template-selection" type="button" hidden>選択解除（すべて）</button>
          </div>
        </div>
        <div id="symbol-view" role="tabpanel" aria-labelledby="symbol-tab" hidden>
          <div id="symbol-items"></div>
        </div>
      </section>
    </div>
  </main>
</body>
</html>
